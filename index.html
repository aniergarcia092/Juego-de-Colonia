<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Colonia · Pixi</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120a0b; touch-action: none; }
    #app { position: fixed; inset: 0; }
    #minimap { position: fixed; right: 12px; top: 60px; border: 2px solid #000; border-radius: 4px; cursor: pointer; image-rendering: pixelated; box-shadow: 0 2px 10px #0008; }

    /* --- Joystick virtual --- */
    #joystick {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 100;
      user-select: none;
      touch-action: none;
      opacity: 0.85;
    }
    #joystick-base {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      position: relative;
    }
    #joystick-knob {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 154, 46, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.6);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: background 0.1s;
    }
    #joystick.activo #joystick-knob { background: rgba(255, 200, 100, 1); }

    /* --- Botones de acción --- */
    .boton-accion {
      position: fixed;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    .boton-accion:active { transform: scale(0.93); filter: brightness(1.2); }

    #btn-accion {
      bottom: 40px;
      right: 30px;
      width: 80px;
      height: 80px;
      background: rgba(61, 143, 209, 0.85);
    }
    #btn-correr {
      bottom: 135px;
      right: 35px;
      width: 65px;
      height: 65px;
      background: rgba(255, 100, 80, 0.85);
      font-size: 18px;
    }

    /* Ocultar todo el control hasta que el rover esté listo */
    .oculto { display: none !important; }
  </style>
  <script type="module" crossorigin src="/Juego-de-Colonia/assets/index-BJbbZmBr.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Controles táctiles (solo se ven cuando el rover existe) -->
  <div id="joystick" class="oculto">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <button id="btn-accion" class="boton-accion oculto" title="Volver al rover">⌂</button>
  <button id="btn-correr" class="boton-accion oculto" title="Correr">⚡</button>

</body>
</html>
